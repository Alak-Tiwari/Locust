#locust configuration is used so that one doesn't need to type cmd line everytime
#just mention it at once in a separate file and use it wherever you want

#Store the info in key value pair and these values would be run before the execution 
#of locust program

#Runtime Settings
[runtime settings]
host:http://httpbin.org
users:2
spawn-rate:1
run-time:5s
headless:true
only-summary:true

#but command line would always has higher precedence if its there it would override the
#runtime settings

